<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speedrun Timer — frame-exact video</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
<link rel="stylesheet" href="style.css?v=20260910d">
</head>
<body>
<header class="top">
  <div class="wrap head">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#e6ebf2" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 1.5"/><path d="M9.5 2.5h5M12 2.5V6"/></svg></span>
      <div>
        <h1>Speedrun Timer <span class="badge">frame-exact</span></h1>
        <p class="sub">Frame-quantized timer · Exact FPS · exports MP4 without screen recording</p>
      </div>
    </div>
    <div class="fps-chip" id="fpsChip">60 fps · frame = 16.667 ms</div>
  </div>
</header>

<main class="wrap grid">
  <section class="card controls">
    <div class="step"><span class="n">1</span><h2>Time &amp; FPS</h2></div>
    <label class="field">Video duration <small>(e.g. 90 · 1:30 · 10:00.000 · 1:02:03)</small>
      <input id="duration" value="1:00" inputmode="text" autocomplete="off" spellcheck="false">
    </label>
    <div class="presets" id="durPresets">
      <button data-d="10">10s</button><button data-d="30">30s</button>
      <button data-d="60">1min</button><button data-d="300">5min</button>
      <button data-d="600">10min</button><button data-d="3600">1h</button>
    </div>
    <div id="durInfo" class="info">—</div>

    <label class="field">Exact FPS of the timer <b>and</b> the video
      <input id="fps" type="number" value="60" step="any" min="1" max="240">
    </label>
    <div class="presets" id="fpsPresets">
      <button data-f="23.976">23.976</button><button data-f="24">24</button>
      <button data-f="30">30</button><button data-f="50">50</button>
      <button data-f="59.94">59.94</button><button data-f="60">60</button>
      <button data-f="120">120</button><button data-f="144">144</button>
    </div>
    <div id="fpsInfo" class="info">60fps → 000 · 017 · 033 · 050 …</div>

    <div class="step"><span class="n">2</span><h2>Look</h2></div>
    <div class="row">
      <label class="field">Width<input id="w" type="number" value="1920" min="160" max="3840"></label>
      <label class="field">Height<input id="h" type="number" value="1080" min="120" max="2160"></label>
    </div>
    <div class="presets" id="resPresets">
      <button data-w="1920" data-h="1080">1080p</button>
      <button data-w="1280" data-h="720">720p</button>
      <button data-w="1080" data-h="1080">1:1</button>
      <button data-w="1080" data-h="1920">vertical</button>
    </div>
    <div class="row">
      <label class="field">Background
        <select id="bg">
          <option value="transparent">Transparent (alpha)</option>
          <option value="#000000">Black</option>
          <option value="#00FF00" selected>Green chroma</option>
          <option value="#0000FF">Blue chroma</option>
          <option value="#FFFFFF">White</option>
          <option value="custom">Custom color…</option>
        </select>
      </label>
      <label class="field">Custom color <input id="bgCustom" type="color" value="#00ff00"></label>
    </div>
    <div class="row">
      <label class="field">Text color <input id="fg" type="color" value="#ffffff"></label>
      <label class="field">Size <span class="val" id="fontSizeVal">160px</span>
        <input id="fontSize" type="range" min="24" max="400" value="160">
      </label>
    </div>
    <label class="field">Font
      <select id="font">
        <option value="'JetBrains Mono','Cascadia Mono',Consolas,'Roboto Mono',monospace">Monospace</option>
        <option value="Arial,Helvetica,Roboto,sans-serif">Sans (Arial / Roboto)</option>
        <option value="Georgia,'Noto Serif','Times New Roman',serif">Serif (Georgia)</option>
        <option value="'Arial Black','Archivo Black',Impact,sans-serif">Heavy (Arial Black / Impact)</option>
        <option value="Verdana,'Trebuchet MS',Geneva,sans-serif">Wide (Verdana)</option>
      </select>
    </label>
    <div class="row align-end">
      <label class="field">Format
        <select id="fmt">
          <option value="auto">Auto (h only if ≥1h)</option>
          <option value="always">H:MM:SS.mmm</option>
          <option value="never">MM:SS.mmm</option>
        </select>
      </label>
      <label class="chk"><input id="stroke" type="checkbox" checked> <span>outline/shadow</span></label>
    </div>
    <label class="field">Video quality <span class="val" id="bitrateVal">12 Mbps</span>
      <input id="bitrate" type="range" min="2" max="40" value="12">
    </label>

    <div class="step"><span class="n">3</span><h2>Export</h2></div>
    <button id="btnExport" class="big"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg> Download MP4 video</button>
    <progress id="prog" value="0" max="100" hidden></progress>
  </section>

  <section class="card preview">
    <div class="pv-head">
      <h2>Preview</h2>
      <span class="pill mono" id="frameLabel">frame 0/3600</span>
    </div>
    <div class="canvasBox"><canvas id="cv"></canvas></div>
    <div class="transport">
      <button id="btnPlay" title="Play/pause">▶</button>
      <button id="btnRestart" title="Back to start">⏮</button>
      <input id="seek" type="range" min="0" max="3599" value="0" aria-label="Scrub frames">
      <span id="timeLabel" class="mono">00:00.000</span>
    </div>
    <div class="frames mono" id="frameStrip"></div>
  </section>
</main>

<script src="timer-core.js?v=20260910d"></script>
<script type="module" src="export-mp4.js?v=20260910d"></script>
<script src="app.js?v=20260910d"></script>
</body>
</html>
